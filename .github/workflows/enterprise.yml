name: CQL release validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "17", "18"]
    container:
      image: crystallang/crystal:1.22.1
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: cql-validation-only
          POSTGRES_DB: cql_v1
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:cql-validation-only@postgres:5432/cql_v1
      CRYSTAL_WORKERS: "4"
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y libsqlite3-dev
      - run: shards install
      - name: Threaded contention and shutdown recovery
        run: >-
          crystal spec -Dpreview_mt validation/native_stress_spec.cr spec/postgres/pool_shutdown_spec.cr
          spec/postgres/circuit_breaker_spec.cr spec/postgres/setup_deadline_spec.cr
          spec/postgres/transaction_scope_fiber_spec.cr
      - name: Protocol, live transactions, cancellation and migration locking
        run: >-
          crystal spec spec/postgres/handshake_spec.cr spec/postgres/wire_spec.cr
          spec/postgres/wire_fuzz_spec.cr spec/postgres/live_spec.cr
          spec/postgres/engine_failover_live_spec.cr spec/postgres/migrator_lock_live_spec.cr
          spec/postgres/query_timeout_spec.cr

  dialects:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        dialect: [sqlite, postgres, mysql, cockroach]
    env:
      CQL_ENTERPRISE_DIALECT: ${{ matrix.dialect }}
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.1
      - run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - run: shards install
      - name: Start the selected disposable database
        shell: bash
        run: |
          set -euo pipefail
          case "$CQL_ENTERPRISE_DIALECT" in
            sqlite)
              echo "CQL_ENTERPRISE_URL=sqlite3:///tmp/cql-v1.db" >> "$GITHUB_ENV"
              ;;
            postgres)
              docker run -d --name cql-v1-db -p 127.0.0.1:15432:5432 -e POSTGRES_PASSWORD=cql-validation-only -e POSTGRES_DB=cql_v1 postgres:17
              for i in {1..60}; do docker exec cql-v1-db pg_isready -U postgres && break; sleep 1; done
              docker exec cql-v1-db pg_isready -U postgres
              echo "CQL_ENTERPRISE_URL=postgres://postgres:cql-validation-only@127.0.0.1:15432/cql_v1" >> "$GITHUB_ENV"
              ;;
            mysql)
              # crystal-mysql currently supports mysql_native_password, not caching_sha2_password.
              docker run -d --name cql-v1-db -p 127.0.0.1:13306:3306 -e MYSQL_ROOT_PASSWORD=cql-validation-only -e MYSQL_DATABASE=cql_v1 mysql:8.0 --default-authentication-plugin=mysql_native_password
              for i in {1..60}; do docker exec cql-v1-db mysql -uroot -pcql-validation-only -e 'SELECT 1' && break; sleep 1; done
              docker exec cql-v1-db mysql -uroot -pcql-validation-only -e "CREATE USER 'cql'@'%' IDENTIFIED WITH mysql_native_password BY 'cql-validation-only'; GRANT ALL ON cql_v1.* TO 'cql'@'%';"
              docker exec cql-v1-db mysql -uroot -pcql-validation-only -e "UPDATE performance_schema.setup_consumers SET ENABLED='YES' WHERE NAME='events_transactions_current'; GRANT SELECT ON performance_schema.* TO 'cql'@'%';"
              echo "CQL_ENTERPRISE_URL=mysql://cql:cql-validation-only@127.0.0.1:13306/cql_v1" >> "$GITHUB_ENV"
              ;;
            cockroach)
              docker run -d --name cql-v1-db --network host cockroachdb/cockroach:v24.3.0 start-single-node --insecure --listen-addr=127.0.0.1:26257 --http-addr=127.0.0.1:18081
              for i in {1..60}; do docker exec cql-v1-db cockroach sql --insecure --host=127.0.0.1:26257 -e 'SELECT 1' && break; sleep 1; done
              docker exec cql-v1-db cockroach sql --insecure --host=127.0.0.1:26257 -e 'SELECT 1'
              echo "CQL_ENTERPRISE_URL=postgres://root@127.0.0.1:26257/defaultdb?sslmode=disable" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Live optimistic locking, savepoints and isolation (no skips)
        run: crystal spec validation/dialect_spec.cr
      - name: Database logs
        if: failure() && matrix.dialect != 'sqlite'
        run: docker logs cql-v1-db
      - name: Remove owned database
        if: always() && matrix.dialect != 'sqlite'
        run: docker rm -f cql-v1-db

  macro-and-allocation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y python3 libsqlite3-dev
      - run: shards install
      - run: python3 script/macro-fuzz.py --seed 65 --cases 64
      - name: Advanced SQL and compiler diagnostics
        run: >-
          crystal spec spec/expression/cte_spec.cr spec/expression/window_functions_spec.cr
          spec/expression/json_and_geo_spec.cr spec/patterns/active_record/compile_time_safety_spec.cr
      - name: Allocation and diagnostics contracts
        run: >-
          crystal spec spec/performance/overhead_spec.cr spec/performance/tracer_once_spec.cr
          spec/performance/n_plus_one_backtrace_spec.cr

  tls:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_MATRIX_BINS: 16=/usr/lib/postgresql/16/bin
      PG_TLS_BIN: /usr/lib/postgresql/16/bin
      NOTLS_PG_PORT: "5516"
      CQL_TLS_PG_PORT: "5640"
    steps:
      - uses: actions/checkout@v4
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.1
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16 libsqlite3-dev
      - run: shards install
      - run: script/pg-matrix start
      - run: script/tls-probes
      - name: TLS validation and stalled encrypted connections
        run: crystal spec spec/postgres/transport_spec.cr spec/postgres/blackhole_spec.cr
      - name: Stop owned servers
        if: always()
        run: |
          script/pg-matrix stop
          /usr/lib/postgresql/16/bin/pg_ctl -D /tmp/cql-pg-tls/data -m immediate stop || true

name: crystal-db compatibility

# Called by Crystal CI on every push that changes code (workflow_call), weekly (a new crystal-db release can break
# CQL without any push here) and by hand. It no longer runs on push itself: that ran it twice per push.
on:
  workflow_call:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Compile CQL against every supported crystal-db
        run: script/check_db_compat 0.13.1 0.14.0 0.15.0 latest

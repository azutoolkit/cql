name: Crystal CI

# Pushes to master and manual runs. Which jobs run follows the git diff of the push (see the `changes` job): a push
# that only touches documentation runs the documentation checks and nothing else, and releases nothing.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One queue per ref: a run that is waiting is replaced by the newest push; a running one (it may be releasing) finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # What the push changed. A path is code unless it is known to be documentation or ignorable, so a path nobody
  # classified runs the tests, and a change to a workflow runs everything. A manual run, a new or force-pushed ref and
  # an API error run everything too.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=false; docs=false; files=""
          if [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api --paginate "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || files=""
          fi
          if [ -z "$files" ]; then
            code=true; docs=true
          else
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/*) code=true; docs=true ;;
                docs/*|script/docs/*) docs=true ;;
                .claude/*|.github/ISSUE_TEMPLATE/*|.github/*.md|LICENSE) ;;
                */*) code=true ;;
                *.md) docs=true ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "code=$code docs=$docs"

  enterprise:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/enterprise.yml

  db-compat:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/db-compat.yml

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: crystallang/crystal:1.22.1

    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: example
          POSTGRES_PASSWORD: example
          POSTGRES_DB: example
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Update package list and install SQLite and development files
        run: |
          apt-get update
          apt-get install -y sqlite3 libsqlite3-dev
          apt-get install -y postgresql-client mysql-client
      - name: Verify SQLite installation
        run: sqlite3 --version
      - name: Create SQLite databases
        run: |
          touch ./spec/support/db/northwind.db
          touch ./spec/support/db/data.db
          touch ./spec/support/db/billing.db
          touch ./spec/support/db/tabledb.db
          chmod 664 ./spec/support/db/northwind.db
          chmod 664 ./spec/support/db/data.db
          chmod 664 ./spec/support/db/billing.db
          chmod 664 ./spec/support/db/tabledb.db
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Check formatting
        run: crystal tool format --check ./src ./spec ./validation
      - name: Check code linting with Ameba
        run: crystal run lib/ameba/bin/ameba.cr -- -f progress ./src ./spec ./validation
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h postgres -U example && break
            echo "Waiting for postgres..."
            sleep 1
          done
      - name: Run tests
        env:
          DATABASE_URL: postgres://example:example@postgres:5432/example
        run: crystal spec
  # The oldest tested Crystal: a construct newer compilers accept and 1.19 rejects fails here instead of in every
  # application that builds with 1.19.
  build-crystal-1-19:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and the database clients
        run: |
          apt-get update
          apt-get install -y sqlite3 libsqlite3-dev postgresql-client mysql-client
      - name: Create SQLite databases
        run: |
          for db in northwind data billing tabledb; do
            touch ./spec/support/db/$db.db
            chmod 664 ./spec/support/db/$db.db
          done
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Run tests (SQLite; server dialects are pending without their servers)
        run: crystal spec
  # The checks in script/docs/: links and anchors, navigation and redirects, GitBook markup.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml==6.0.2
      - name: Check links and anchors
        run: python script/docs/check_links.py
      - name: Check the navigation and redirects
        run: python script/docs/check_nav.py
      - name: Lint GitBook markup
        run: python script/docs/gitbook_lint.py
  # Compiles the docs' programs and tutorials, so a page cannot drift from the API.
  # The programs compile against src, so a code change runs this too.
  docs-snippets:
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and SQLite (tutorial steps marked run are executed)
        run: |
          apt-get update
          apt-get install -y python3 libsqlite3-dev
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Compile the programs in the docs
        run: python3 script/docs/compile_snippets.py
  # Every push that changed code and passed is released: shard.yml and the changelog are bumped in one commit, and that
  # commit is tagged. Jobs the diff skipped (the documentation checks on a code-only push) do not block it.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
      - enterprise
      - db-compat
      - build
      - build-crystal-1-19
      - docs
      - docs-snippets
    if: >-
      always() &&
      github.event_name == 'push' &&
      needs.changes.outputs.code == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.publish.outputs.version }}
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release contract (merge strategies, publication guard) is verified here, before the release, so it gates
      # the release without a runner of its own.
      - uses: actions/checkout@v4
        with:
          repository: paulhatch/semantic-version
          ref: v4.0.2
          path: .release-action
      - name: Verify merge strategies and publication guard
        run: python3 script/test_release.py --action .release-action/dist/index.js
      - name: Remove the action checkout (the release works on a clean tree)
        run: rm -rf .release-action
      - name: Compute Release Version
        id: semver
        uses: paulhatch/semantic-version@v4.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          # A string to determine the format of the version output
          format: "${major}.${minor}.${patch}"
          # Apply the highest bump once per release, regardless of merge strategy.
          bump_each_commit: false
      - name: Require the intended release version
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: script/check-release-version "$VERSION"
      - name: Bump the version, roll the changelog, tag and publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: script/release "$VERSION"
  # Publishes the API reference (crystal docs) for the release to GitHub Pages: https://azutoolkit.github.io/cql/
  # Needs Settings > Pages > Source set to "GitHub Actions" once; a workflow token cannot turn Pages on.
  api-docs:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    container:
      image: crystallang/crystal:1.22.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Build the API reference
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: script/api-docs "$VERSION" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy-api-docs:
    runs-on: ubuntu-latest
    needs: api-docs
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

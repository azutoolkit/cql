name: Crystal CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.22.0

    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: example
          POSTGRES_PASSWORD: example
          POSTGRES_DB: example
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Update package list and install SQLite and development files
        run: |
          apt-get update
          apt-get install -y sqlite3 libsqlite3-dev
          apt-get install -y postgresql-client mysql-client
      - name: Verify SQLite installation
        run: sqlite3 --version
      - name: Create SQLite databases
        run: |
          touch ./spec/support/db/northwind.db
          touch ./spec/support/db/data.db
          touch ./spec/support/db/billing.db
          touch ./spec/support/db/tabledb.db
          chmod 664 ./spec/support/db/northwind.db
          chmod 664 ./spec/support/db/data.db
          chmod 664 ./spec/support/db/billing.db
          chmod 664 ./spec/support/db/tabledb.db
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Check formatting
        run: crystal tool format --check ./src ./spec
      - name: Check code linting with Ameba
        run: crystal run lib/ameba/bin/ameba.cr -- -f progress ./src ./spec
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h postgres -U example && break
            echo "Waiting for postgres..."
            sleep 1
          done
      - name: Run tests
        env:
          DATABASE_URL: postgres://example:example@postgres:5432/example
        run: crystal spec
  # The oldest tested Crystal: a construct newer compilers accept and 1.19 rejects fails here instead of in every
  # application that builds with 1.19.
  build-crystal-1-19:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.19.1
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and the database clients
        run: |
          apt-get update
          apt-get install -y sqlite3 libsqlite3-dev postgresql-client mysql-client
      - name: Create SQLite databases
        run: |
          for db in northwind data billing tabledb; do
            touch ./spec/support/db/$db.db
            chmod 664 ./spec/support/db/$db.db
          done
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Run tests (SQLite; server dialects are pending without their servers)
        run: crystal spec
  # The checks in script/docs/: links and anchors, navigation and redirects, GitBook markup.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Check links and anchors
        run: python script/docs/check_links.py
      - name: Check the navigation and redirects
        run: python script/docs/check_nav.py
      - name: Lint GitBook markup
        run: python script/docs/gitbook_lint.py
  # Compiles the docs' programs and tutorials, so a page cannot drift from the API.
  docs-snippets:
    runs-on: ubuntu-latest
    container:
      image: crystallang/crystal:1.22.0
    steps:
      - uses: actions/checkout@v4
      - name: Install Python and SQLite (tutorial steps marked run are executed)
        run: |
          apt-get update
          apt-get install -y python3 libsqlite3-dev
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Compile the programs in the docs
        run: python3 script/docs/compile_snippets.py
  # Every push to master is released: shard.yml and the changelog are bumped in one commit, and that commit is tagged.
  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - build-crystal-1-19
      - docs
      - docs-snippets
    if: ${{ success() && github.event_name == 'push' }}
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.semver.outputs.version }}
      released: ${{ steps.publish.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute Release Version
        id: semver
        uses: paulhatch/semantic-version@v4.0.2
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "(MINOR)"
          # A string to determine the format of the version output
          format: "${major}.${minor}.${patch}"
          # If this is set to true, *every* commit will be treated as a new version.
          bump_each_commit: true
      - name: Bump the version, roll the changelog, tag and publish the release
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: script/release "$VERSION"
  # Publishes the API reference (crystal docs) for the release to GitHub Pages: https://azutoolkit.github.io/cql/
  api-docs:
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.released == 'true' }}
    container:
      image: crystallang/crystal:1.22.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Install shards
        run: shards install --ignore-crystal-version
      - name: Build the API reference
        run: script/api-docs "${{ needs.release.outputs.version }}" _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy-api-docs:
    runs-on: ubuntu-latest
    needs: api-docs
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
